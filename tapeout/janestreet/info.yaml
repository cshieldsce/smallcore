# Tiny Tapeout project information
project:
  title:        "SmallCore"
  author:       "Charlie Shields"
  discord:      ""
  description:  "PIO-style programmable protocol engine: 16-bit words with a per-word delay, shift registers, FIFOs, WAIT and SKIP"
  language:     "Verilog"
  clock_hz:     0       # not decided yet; the template's CLOCK_PERIOD of 20 ns (50 MHz) is the flow's constraint

  # Jane Street protocol emulator competition allocation: 6x4 tiles on IHP CMOS5L
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_cshieldsce_smallcore"

  # Source files live in ./src. core.v is staged from ../../rtl/core.v by `make sync`; do not edit it here.
  source_files:
    - "tt_um_cshieldsce_smallcore.v"
    - "core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# PROVISIONAL: this mapping only lets the flow elaborate the current core. It is not the final pinout.
pinout:
  # Inputs
  ui[0]: "imem_word[0] (provisional)"
  ui[1]: "imem_word[1] / tx_empty (provisional)"
  ui[2]: "imem_word[2] (provisional)"
  ui[3]: "imem_word[3] (provisional)"
  ui[4]: "imem_word[4] / gpio_in[0] / rx_full (provisional)"
  ui[5]: "imem_word[5] / gpio_in[1] (provisional)"
  ui[6]: "imem_word[6] / gpio_in[2] (provisional)"
  ui[7]: "imem_word[7] / gpio_in[3] (provisional)"

  # Outputs
  uo[0]: "imem_addr[0] (provisional)"
  uo[1]: "imem_addr[1] (provisional)"
  uo[2]: "imem_addr[2] (provisional)"
  uo[3]: "imem_addr[3] (provisional)"
  uo[4]: "imem_addr[4] (provisional)"
  uo[5]: "imem_addr[5] (provisional)"
  uo[6]: "imem_addr[6] (provisional)"
  uo[7]: "imem_addr[7] (provisional)"

  # Bidirectional pins
  uio[0]: "gpio_out[0] out / imem_word[8] in (provisional)"
  uio[1]: "gpio_out[1] out / imem_word[9] in (provisional)"
  uio[2]: "gpio_out[2] out / imem_word[10] in (provisional)"
  uio[3]: "gpio_out[3] out / imem_word[11] in (provisional)"
  uio[4]: "imem_word[12] (provisional)"
  uio[5]: "imem_word[13] (provisional)"
  uio[6]: "imem_word[14] (provisional)"
  uio[7]: "imem_word[15] (provisional)"

# Do not change!
yaml_version: 6
