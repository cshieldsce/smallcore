# Tiny Tapeout IHP CMOS5L build of asic/janestreet/. Runs on every push to main that touches the RTL or the
# tapeout staging, and by hand: Actions tab -> "tapeout gds" -> Run workflow. The run's summary and artifacts
# (metrics, GDS) are the record; the numbers that matter go in docs/physical-results.md.
# Same jobs as the official ttihp-verilog-template (cmos5l branch). The Tiny Tapeout action expects info.yaml,
# src/, docs/ and test/ at the repository root, so the first step copies the staging directory up.
# The viewer job needs GitHub Pages enabled with source "GitHub Actions" (repo Settings -> Pages).
name: tapeout gds

on:
  push:
    branches: [main]
    paths:
      - "rtl/**"
      - "asic/janestreet/**"
      - ".github/workflows/tapeout-gds.yaml"
  workflow_dispatch:

# A build takes about 40 minutes; a newer push supersedes one still running.
concurrency:
  group: tapeout-gds
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: stage asic/janestreet at the repository root
        run: |
          make -C asic/janestreet check   # fail if src/ drifted from rtl/: run make tapeout-sync
          cp -r asic/janestreet/info.yaml asic/janestreet/src asic/janestreet/test asic/janestreet/LICENSE .
          cp asic/janestreet/docs/info.md docs/

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: stage the testbench at the repository root
        run: cp -r asic/janestreet/src asic/janestreet/test .

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
