# Tiny Tapeout project information
project:
  title:        "SmallCore"
  author:       "Charlie Shields"
  discord:      ""
  description:  "PIO-style programmable protocol peripheral: 15 UART/SPI/I2C/SWD/CAN programs in ROM, a host-loadable 256-word program RAM, a 4-register host bus, four bidirectional pads"
  language:     "Verilog"
  clock_hz:     0       # not decided yet; the template's CLOCK_PERIOD of 20 ns (50 MHz) is the flow's constraint

  # Jane Street protocol emulator competition allocation: 6x4 tiles on IHP CMOS5L
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_cshieldsce_smallcore"

  # Source files live in ./src. All but the wrapper are staged from ../../rtl/ by `make sync`; do not edit them here.
  source_files:
    - "tt_um_cshieldsce_smallcore.v"
    - "smallcore.v"
    - "host.v"
    - "rom.v"
    - "ram.v"
    - "top.v"
    - "core.v"
    - "fifo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# Host register bus: ui = write data, uo = read data, uio[7:4] = re, we, addr[1:0] as inputs.
# Protocol pads: uio[3:0] = gpio[3:0], bidirectional; the programs pick what each pin is.
pinout:
  # Inputs
  ui[0]: "host_wdata[0]"
  ui[1]: "host_wdata[1]"
  ui[2]: "host_wdata[2]"
  ui[3]: "host_wdata[3]"
  ui[4]: "host_wdata[4]"
  ui[5]: "host_wdata[5]"
  ui[6]: "host_wdata[6]"
  ui[7]: "host_wdata[7]"

  # Outputs
  uo[0]: "host_rdata[0]"
  uo[1]: "host_rdata[1]"
  uo[2]: "host_rdata[2]"
  uo[3]: "host_rdata[3]"
  uo[4]: "host_rdata[4]"
  uo[5]: "host_rdata[5]"
  uo[6]: "host_rdata[6]"
  uo[7]: "host_rdata[7]"

  # Bidirectional pins
  uio[0]: "gpio[0]: MOSI / UART TX / UART RX / SDA"
  uio[1]: "gpio[1]: SCLK / SCL"
  uio[2]: "gpio[2]: CS"
  uio[3]: "gpio[3]: MISO"
  uio[4]: "host_addr[0] (input)"
  uio[5]: "host_addr[1] (input)"
  uio[6]: "host_we (input)"
  uio[7]: "host_re (input)"

# Do not change!
yaml_version: 6
